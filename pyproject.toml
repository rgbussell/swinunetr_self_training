[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swinunetr-self-training"
version = "0.1.0"
description = "Self-training with iterative pseudo-labeling for SwinUNETR brain tumor segmentation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Robert Bussell"},
]
keywords = [
    "medical-imaging", "segmentation", "semi-supervised", "pseudo-labeling",
    "self-training", "swinunetr", "brain-tumor", "monai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "swinunetr-seg @ file:///home/rbussell/projects/vit_swinunetr_segmentation",
    "monai[all]>=1.3",
    "torch>=2.0",
    "nibabel",
    "numpy",
    "pyyaml",
    "tensorboard",
    "matplotlib",
    "tqdm",
    "pandas",
    "seaborn",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "pre-commit", "detect-secrets"]

[project.scripts]
st-train = "swinunetr_st.cli:self_train"
st-pseudo-label = "swinunetr_st.cli:generate_pseudo_labels"
st-compare = "swinunetr_st.cli:compare_results"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

model:
  type: resenc_unet
  in_channels: 4
  out_channels: 3

self_training:
  num_rounds: 4
  epochs_per_round: 100
  val_interval: 5

  # EMA Teacher
  ema_decay: 0.999
  ema_warmup_steps: 100

  # Curriculum thresholding
  initial_threshold: 0.95
  final_threshold: 0.75
  threshold_schedule: cosine
  per_class_offsets:
    TC: 0.0
    WT: -0.05
    ET: 0.05

  # Loss weighting
  supervised_weight: 1.0
  pseudo_label_weight: 0.5
  consistency_weight: 0.1
  ramp_up_epochs: 20

  # Quality control
  min_confidence_fraction: 0.001
  max_pseudo_label_ratio: 0.5

training:
  lr: 5.0e-5
  weight_decay: 1.0e-5
  warmup_epochs: 10
  batch_size: 1
  num_workers: 2
  amp: true
  gradient_accumulation_steps: 1
  early_stopping_patience: 30

data:
  roi_size: [96, 96, 96]
  train_val_split: 0.8
  cache_rate: 0.1
  strong_augmentation:
    gaussian_noise_std: 0.1
    gamma_range: [0.7, 1.5]
    brightness_range: [0.7, 1.3]
    contrast_range: [0.65, 1.5]
    gaussian_smooth_sigma: [0.5, 1.15]

paths:
  # Paths are relative to the project root. The sibling repo
  # vit_swinunetr_segmentation supplies the base data + baseline checkpoint.
  base_data_dir: ../vit_swinunetr_segmentation/data/Task01_BrainTumour
  baseline_checkpoint: ../vit_swinunetr_segmentation/checkpoints/openmind/best_model.pt
  output_dir: outputs/openmind
  checkpoint_dir: checkpoints/openmind
  pseudo_label_dir: pseudo_labels/openmind
  results_dir: results/openmind
